<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🦆 Duck Treasure Hunt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --duck:   #FFD700;
    --duck-dim: #B89800;
    --bg:     #0d0f14;
    --surface:#151820;
    --card:   #1c1f2b;
    --border: #262a38;
    --text:   #e8eaf0;
    --muted:  #6b7080;
    --gold:   #FFD700;
    --silver: #C0C8D8;
    --bronze: #CD7F32;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--duck);
    padding: 28px 40px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .header-left h1 {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--duck);
    letter-spacing: -0.3px;
  }

  .header-left h1 span { color: var(--text); }

  .header-left p {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1a1f12;
    border: 1px solid #3a4a1a;
    color: #7ec850;
    font-size: 0.78rem;
    font-family: 'Space Mono', monospace;
    padding: 6px 14px;
    border-radius: 20px;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: #7ec850;
    border-radius: 50%;
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    gap: 16px;
    padding: 16px 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .stat-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .stat-chip strong {
    color: var(--duck);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    display: block;
  }

  /* ── Main ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 36px 24px;
  }

  /* ── Table ── */
  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-size: 0.72rem;
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0 16px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  thead th.center { text-align: center; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:hover { background: var(--card); }

  tbody td {
    padding: 14px 16px;
    font-size: 0.95rem;
  }

  .rank-cell {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1.1rem;
    width: 60px;
  }

  .rank-1 { color: var(--gold); }
  .rank-2 { color: var(--silver); }
  .rank-3 { color: var(--bronze); }
  .rank-n { color: var(--muted); }

  .name-cell {
    font-weight: 600;
    font-size: 1rem;
  }

  .time-cell {
    text-align: right;
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    color: var(--duck);
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty-state .duck-big { font-size: 4rem; margin-bottom: 16px; }
  .empty-state p { font-size: 1rem; }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 24px;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>🦆 Duck <span>Treasure Hunt</span></h1>
    <p>Homs CP University Fair · Live Standings</p>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE · refreshes every 5s
  </div>
</header>

<div class="stats-bar">
  <div class="stat-chip"><strong id="total-count">—</strong>participants</div>
  <div class="stat-chip"><strong id="fastest-time">—</strong>fastest time</div>
</div>

<main>
  <table>
    <thead>
      <tr>
        <th class="center">Rank</th>
        <th>Name</th>
        <th style="text-align:right">Time 🦆</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty-state" style="display:none">
    <div class="duck-big">🦆</div>
    <p>The hunt hasn't started yet. Ducks are getting ready…</p>
  </div>
</main>

<footer>🦆 Duck Treasure Hunt · Homs CP University Fair</footer>

<script>
const BIN_ID  = '6ab2b9eeffd5d1605323c2d8';
const API_KEY = '$2a$10$kTWZAmRf2LMtsqir/UHGb.2Nd0YygmGZP0BOCtj/BZhiuO2TTgXjm';
const BASE    = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

function fmtTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}

function rankIcon(r) {
  if (r === 1) return '🥇';
  if (r === 2) return '🥈';
  if (r === 3) return '🥉';
  return r;
}

function rankClass(r) {
  if (r === 1) return 'rank-1';
  if (r === 2) return 'rank-2';
  if (r === 3) return 'rank-3';
  return 'rank-n';
}

async function load() {
  try {
    const res  = await fetch(`${BASE}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const data = await res.json();
    const participants = (data.record?.participants || [])
      .filter(p => p.done)
      .sort((a, b) => a.elapsed - b.elapsed);

    const tbody = document.getElementById('rows');
    const empty = document.getElementById('empty');

    document.getElementById('total-count').textContent = participants.length || '0';

    if (!participants.length) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      document.getElementById('fastest-time').textContent = '—';
      return;
    }

    empty.style.display = 'none';
    document.getElementById('fastest-time').textContent = fmtTime(participants[0].elapsed);

    tbody.innerHTML = participants.map((p, i) => {
      const rank = i + 1;
      return `
        <tr>
          <td class="rank-cell ${rankClass(rank)}">${rankIcon(rank)}</td>
          <td class="name-cell">${p.name}</td>
          <td class="time-cell">${fmtTime(p.elapsed)}</td>
        </tr>
      `;
    }).join('');
  } catch(e) {
    console.error('Load error:', e);
  }
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
